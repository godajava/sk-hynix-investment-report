name: Pre-market snapshot (night futures)

on:
  schedule:
    # 평일 06:10 KST(21:10 UTC 일~목) — 야간선물 06:00 종료 직후 / 08:40 KST(23:40 UTC) — 주간 개장(08:45) 직전 재수집
    - cron: "10 21 * * 0-4"
    - cron: "40 23 * * 0-4"
  workflow_dispatch:
    inputs:
      commit:
        description: "docs/night_futures.json을 main에 커밋. 미체크 시 로그 출력만(프리마켓 브리핑용 읽기 전용)."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  night:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch snapshot
        run: python3 scripts/fetch_night.py docs/night_futures.json --print
      - name: Commit if changed
        if: ${{ github.event_name == 'schedule' || inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/night_futures.json
          git diff --cached --quiet || { git commit -m "프리마켓 스냅샷(야간선물·미국 반도체) 갱신 (자동)"; git pull --rebase origin main; git push; }
