name: Probe quote sources (temporary)

# 브라우저에서 실시간 시세를 직접 받아올 수 있는 소스를 가려내기 위한 임시 진단용.
# 각 후보의 응답 본문과 CORS 헤더(access-control-allow-origin)를 함께 확인한다.
# 확인이 끝나면 이 워크플로는 삭제한다.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: TradingView scanner (KRX:000660)
        continue-on-error: true
        run: |
          echo "=== TradingView scanner ==="
          curl -sS -D - -o /tmp/tv.txt --max-time 25 \
            -H "Origin: https://godajava.github.io" \
            "https://scanner.tradingview.com/symbol?symbol=KRX%3A000660&fields=lp,chp,ch,update_mode" \
            | grep -iE "^HTTP/|access-control-allow-origin" || true
          echo "--- body ---"; head -c 400 /tmp/tv.txt; echo

      - name: Stooq CSV (000660.kr)
        continue-on-error: true
        run: |
          echo "=== Stooq ==="
          curl -sS -D - -o /tmp/stooq.txt --max-time 25 \
            -H "Origin: https://godajava.github.io" \
            "https://stooq.com/q/l/?s=000660.kr&f=sd2t2ohlcv&h&e=csv" \
            | grep -iE "^HTTP/|access-control-allow-origin" || true
          echo "--- body ---"; head -c 400 /tmp/stooq.txt; echo

      - name: Yahoo chart API (000660.KS)
        continue-on-error: true
        run: |
          echo "=== Yahoo chart ==="
          curl -sS -D - -o /tmp/yh.txt --max-time 25 \
            -H "Origin: https://godajava.github.io" \
            -H "User-Agent: Mozilla/5.0" \
            "https://query1.finance.yahoo.com/v8/finance/chart/000660.KS?interval=1m&range=1d" \
            | grep -iE "^HTTP/|access-control-allow-origin" || true
          echo "--- body(meta 일부) ---"
          python3 - <<'PY'
          import json
          try:
              d = json.load(open("/tmp/yh.txt"))
              m = d["chart"]["result"][0]["meta"]
              print({k: m.get(k) for k in
                     ("regularMarketPrice", "previousClose", "regularMarketTime",
                      "exchangeTimezoneName", "exchangeName")})
          except Exception as e:
              print("parse fail:", e)
          PY
